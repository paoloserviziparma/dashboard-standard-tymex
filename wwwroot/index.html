// Filtra righe applicando filtri dropdown + selezioni cross-filter,
// ma esclude la dimensione `excludeDim` dalla selezione (per non auto-filtrarsi)
function getDashRowsFor(excludeDim) {
    if (!dashData) return [];
    return dashData.rows.filter(r => {
        const d = (r.date || '').slice(0, 10);
        if (dashFilters.dataDal && d < dashFilters.dataDal) return false;
        if (dashFilters.dataAl && d > dashFilters.dataAl) return false;
        if (dashFilters.commessa !== 'all' && r.projectDescription !== dashFilters.commessa) return false;
        if (clienteFiltri.dash.scelto && r.customerFiscalName !== clienteFiltri.dash.scelto) return false;
        // Cross-filter: applica tutte le selezioni tranne la propria dimensione
        if (excludeDim !== 'commessa' && dashSelection.commessa && r.projectDescription !== dashSelection.commessa) return false;
        if (excludeDim !== 'operatore' && dashSelection.operatore && r.operatorDisplayName !== dashSelection.operatore) return false;
        if (excludeDim !== 'servizio' && dashSelection.servizio && r.serviceDescription !== dashSelection.servizio) return false;
        if (excludeDim !== 'cliente' && dashSelection.cliente && clienteRiga(r) !== dashSelection.cliente) return false;
        if (excludeDim !== 'fatturare' && dashSelection.fatturare) {
            let fat = 'No';
            try { fat = JSON.parse(r.customFields || '{}').daFatturare || 'No'; } catch(e) {}
            if (fat !== dashSelection.fatturare) return false;
        }
        return true;
    });
}

// Righe con TUTTI i filtri applicati (per stats)
function getFullyFilteredRows() {
    return getDashRowsFor(null);
}

// Ritorna il costo orario per un operatore da BigQuery operators.costoOrario
function getCostoOrario(opName) {
    return operatorCostRates[opName] || 0;
}

// Come getCostoOrario, per i nomi non normalizzati letti direttamente dai rapportini
function getTariffaOperatore(opName) {
    return getCostoOrario(opName) || getCostoOrario((opName || '').trim().replace(/\s+/g, ' '));
}

async function caricaCruscotto() {
    document.querySelectorAll('.btn-table').forEach(b => b.classList.remove('active'));
    currentTable = null; sortCol = null; sortDir = 0;
    document.querySelector('.rapportini-section').style.display = 'none';
    document.querySelector('.results-header').style.display = 'none';
    document.querySelector('.results-section').classList.add('cruscotto-mode');
    document.getElementById('resultsInfo').textContent = '';

    const container = document.getElementById('resultsContainer');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>Caricamento cruscotto...</div>';

    try {
        const opFilter = (currentUser.allowedOperators && currentUser.allowedOperators.length > 0)
            ? ` WHERE LOWER(operatorDisplayName) IN (${currentUser.allowedOperators.map(o => `'${o.toLowerCase().replace(/'/g, "\\'")}'`).join(',')})`
            : '';
        const sql = `SELECT documentId, date, projectName, projectDescription, customerFiscalName, customerName, serviceName, serviceDescription, operatorDisplayName, workedTime, customFields, creation_date, notes FROM \`tymex-1a330.tymex_client.documents\`${opFilter} ORDER BY date`;
        const resp = await fetch(`${API_BASE}/api/bigquery/query`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sql })
        });
        if (!resp.ok) { const err = await resp.json(); throw new Error(err.detail || resp.statusText); }
        dashData = await resp.json();

        dashMinDate = '9999-12-31'; dashMaxDate = '0000-01-01';
        for (const r of dashData.rows) {
            const d = (r.date || '').slice(0, 10);
            if (d < dashMinDate) dashMinDate = d;
            if (d > dashMaxDate) dashMaxDate = d;
            // Normalizza spazi nel nome operatore (evita duplicati da spazi extra in BigQuery)
            if (r.operatorDisplayName) r.operatorDisplayName = r.operatorDisplayName.trim().replace(/\s+/g, ' ');
            r.customerFiscalName = nomeCliente(r.customerFiscalName);
        }
        clienteFiltri.dash.elenco = elencoClienti(dashData.rows);
        clienteFiltri.dash.scelto = '';
        dashFilters = { commessa: 'all', dataDal: dashMinDate, dataAl: dashMaxDate };
        dashSelection = { commessa: null, operatore: null, servizio: null, fatturare: null, cliente: null };

        renderCruscotto(container);
    } catch (e) {
        container.innerHTML = `<div class="error">Errore: ${escapeHtml(e.message)}</div>`;
    }
}

function toggleOpExpandByIdx(idx) {
    const op = _drillOpKeys[idx];
    if (!op) return;
    if (opExpandedSet.has(op)) opExpandedSet.delete(op);
    else opExpandedSet.add(op);
    aggiornaCruscotto();
}

function toggleCommExpandByIdx(idx) {
    const entry = _drillCommKeys[idx];
    if (!entry) return;
    const key = entry.op + '|||' + entry.comm;
    if (commExpandedMap.has(key)) commExpandedMap.delete(key);
    else commExpandedMap.add(key);
    aggiornaCruscotto();
}

function aggiornaCruscotto() {
    if (!document.getElementById('dashOpTable')) return;
    renderSelectionTags();

    // ---- Operatore table con drill-down inline ----
    _drillOpKeys = [];
    _drillCommKeys = [];
    const rowsForOp = getDashRowsFor('operatore');
    const orePerOp = {};
    const costoPerOp = {};
    for (const r of rowsForOp) {
        const op = r.operatorDisplayName || '?';
        const ore = parseOreDecimali(r.workedTime);
        orePerOp[op] = (orePerOp[op] || 0) + ore;
        const mese = (r.date || '').slice(0, 7);
        const tariffa = getCostoOrario(op, mese);
        if (tariffa > 0) costoPerOp[op] = (costoPerOp[op] || 0) + tariffa * ore;
    }
    const opSorted = Object.entries(orePerOp).sort((a, b) => a[0].localeCompare(b[0]));
    const totOreOp = opSorted.reduce((s, [, v]) => s + v, 0);
    const totCostoOp = opSorted.reduce((s, [op]) => s + (costoPerOp[op] || 0), 0);
    const selOp = dashSelection.operatore;
    const showCosts = currentUser.canSeeCosts || currentUser.isAdmin;
    const costCol = showCosts ? '<th style="text-align:right">Costo</th>' : '';

    let opHtml = `<table class="op-table"><thead><tr><th>Operatore</th><th style="text-align:right">Ore</th>${costCol}</tr></thead><tbody>`;
    for (const [op, ore] of opSorted) {
        const isSelected = selOp === op;
        const isDimmed = selOp && !isSelected;
        const cls = isSelected ? 'op-selected' : (isDimmed ? 'op-dimmed' : '');
        const costo = costoPerOp[op] || 0;
        const costoStr = costo > 0 ? costo.toFixed(2) : '-';
        const isOpExp = opExpandedSet.has(op);
        const opArrow = isOpExp ? '▼' : '▶';
        const opIdx = _drillOpKeys.push(op) - 1;

        opHtml += `<tr class="${cls}" style="cursor:pointer" onclick="toggleSelection('operatore','${jsArg(op)}')">
            <td class="op-name"><span class="op-tree-arrow" onclick="event.stopPropagation();toggleOpExpandByIdx(${opIdx})" title="${isOpExp ? 'Chiudi commesse' : 'Espandi commesse'}">${opArrow}</span>${escapeHtml(op)}</td>
            <td style="text-align:right">${ore.toFixed(2)}</td>
            ${showCosts ? `<td style="text-align:right">${costoStr}</td>` : ''}
        </tr>`;

        if (isOpExp) {
            const rowsOp = getFullyFilteredRows().filter(r => r.operatorDisplayName === op);
            const oreComm = {};
            for (const r of rowsOp) {
                const c = r.projectDescription || '?';
                oreComm[c] = (oreComm[c] || 0) + parseOreDecimali(r.workedTime);
            }
            for (const [comm, oreC] of Object.entries(oreComm).sort((a, b) => b[1] - a[1])) {
                const commKey = op + '|||' + comm;
                const isCommExp = commExpandedMap.has(commKey);
                const commArrow = isCommExp ? '▼' : '▶';
                const commIdx = _drillCommKeys.push({ op, comm }) - 1;

                opHtml += `<tr class="op-drill-comm">
                    <td><span class="op-tree-arrow" onclick="toggleCommExpandByIdx(${commIdx})" title="${isCommExp ? 'Chiudi servizi' : 'Espandi servizi'}">${commArrow}</span>${escapeHtml(comm)}</td>
                    <td style="text-align:right">${oreC.toFixed(2)}</td>
                    ${showCosts ? '<td></td>' : ''}
                </tr>`;

                if (isCommExp) {
                    const oreServ = {};
                    for (const r of rowsOp.filter(r => r.projectDescription === comm)) {
                        const s = r.serviceDescription || '?';
                        oreServ[s] = (oreServ[s] || 0) + parseOreDecimali(r.workedTime);
                    }
                    for (const [serv, oreS] of Object.entries(oreServ).sort((a, b) => b[1] - a[1])) {
                        opHtml += `<tr class="op-drill-serv">
                            <td>${escapeHtml(serv)}</td>
                            <td style="text-align:right">${oreS.toFixed(2)}</td>
                            ${showCosts ? '<td></td>' : ''}
                        </tr>`;
                    }
                }
            }
        }
    }
    const totCostoStr = totCostoOp > 0 ? totCostoOp.toFixed(2) : '-';
    opHtml += `<tr class="op-total"><td>Totale</td><td style="text-align:right">${totOreOp.toFixed(2)}</td>${showCosts ? `<td style="text-align:right">${totCostoStr}</td>` : ''}</tr>`;
    opHtml += '</tbody></table>';
    document.getElementById('dashOpTable').innerHTML = opHtml;
    const drillDiv = document.getElementById('dashOpDrill');
    if (drillDiv) drillDiv.innerHTML = '';

    aggiornaCruscottoCharts();
}

function renderOperatorDrill() {
    const drillDiv = document.getElementById('dashOpDrill');
    if (!drillDiv) return;
    const selOp = dashSelection.operatore;
    if (!selOp) { drillDiv.innerHTML = ''; return; }

    // Righe dell'operatore selezionato (con tutti gli altri filtri applicati)
    const rows = getFullyFilteredRows().filter(r => r.operatorDisplayName === selOp);
    if (rows.length === 0) { drillDiv.innerHTML = ''; return; }

    // Raggruppa per commessa
    const orePerComm = {};
    for (const r of rows) {
        const c = r.projectDescription || '?';
        orePerComm[c] = (orePerComm[c] || 0) + parseOreDecimali(r.workedTime);
    }
    const sorted = Object.entries(orePerComm).sort((a, b) => b[1] - a[1]);
    const totOre = sorted.reduce((s, [, v]) => s + v, 0);

    let html = `<div class="drill-panel">
        <h4>Commesse di ${escapeHtml(selOp)}</h4>
        <table class="drill-table"><thead><tr><th>Commessa</th><th style="text-align:right">Ore</th><th style="text-align:right">%</th></tr></thead><tbody>`;
    for (const [comm, ore] of sorted) {
        const pct = totOre > 0 ? (ore / totOre * 100).toFixed(1) : '0';
        html += `<tr><td><span class="drill-link" onclick="showServiziDrill('${jsArg(selOp)}','${jsArg(comm)}')">${escapeHtml(comm)}</span></td><td style="text-align:right">${ore.toFixed(2)}</td><td style="text-align:right">${pct}%</td></tr>`;
    }
    html += `<tr style="font-weight:700;background:#eee"><td>Totale</td><td style="text-align:right">${totOre.toFixed(2)}</td><td style="text-align:right">100%</td></tr>`;

    drillDiv.innerHTML = html;
}

    }

        <table class="drill-table"><thead><tr><th>Servizio</th><th style="text-align:right">Ore</th><th style="text-align:right">%</th></tr></thead><tbody>`;

// Grafico a barre orizzontali delle ore per una dimensione del cross-filter (clic = seleziona)
function disegnaBarreOre(dim, canvasId, wrapId, getEtichetta, opz = {}) {
    const mostra = opz.mostra || (k => k);
    const maxLen = opz.maxLen || 22;
    const orePerVoce = {};
    for (const r of getDashRowsFor(dim)) {
        const k = getEtichetta(r);
        orePerVoce[k] = (orePerVoce[k] || 0) + parseOreDecimali(r.workedTime);
    }
    const sorted = Object.entries(orePerVoce).sort((a, b) => b[1] - a[1]);
    const labels = sorted.map(([k]) => { const t = mostra(k); return t.length > maxLen ? t.slice(0, maxLen - 2) + '…' : t; });
    const values = sorted.map(([, v]) => Math.round(v * 100) / 100);
    const fullNames = sorted.map(([k]) => k);
    const sel = dashSelection[dim];
    const colors = sorted.map(([k]) =>
        sel ? (k === sel ? BAR_COLOR : BAR_COLOR_DIM) : BAR_COLOR
    );

    if (dashCharts[dim]) dashCharts[dim].destroy();
    const ctx = document.getElementById(canvasId);
    const wrap = document.getElementById(wrapId);
    if (ctx && wrap) {
        const barH = 24;
        wrap.style.height = Math.max(sorted.length * barH + 30, wrap.parentElement.clientHeight) + 'px';
        dashCharts[dim] = new Chart(ctx, {
            type: 'bar',
            data: {
                labels,
                datasets: [{ data: values, backgroundColor: colors, borderRadius: 3, maxBarThickness: 32 }]
            },
            options: {
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: !opz.popupRapportini, callbacks: {
                        title: idx => mostra(fullNames[idx[0].dataIndex]),
                        label: c => c.raw.toFixed(2) + ' ore'
                    }}
                },
                scales: {
                    x: { grid: { color: '#eee' } },
                    y: { grid: { display: false }, ticks: { font: { size: 11 } } }
                },
                onHover: opz.popupRapportini ? (evt, elems) => {
                    if (elems.length === 0) { popupLasciato(); return; }
                    const k = fullNames[elems[0].index];
                    if (_dashPopupVoce === k) { clearTimeout(_popupChiudiTimer); clearTimeout(_popupApriTimer); return; }
                    apriPopup(evt.native, e => { opz.popupRapportini(e, k); _dashPopupVoce = k; });
                } : undefined,
                onClick: (evt, elems) => {
                    // Differito: la selezione ridisegna il grafico, che non va distrutto durante il proprio evento
                    if (elems.length > 0) setTimeout(() => toggleSelection(dim, fullNames[elems[0].index]));
                }
            }
        });
        if (opz.popupRapportini) ctx.onmouseleave = popupLasciato;
    }
}

function aggiornaCruscottoCharts() {
    if (!document.getElementById('dashTotOre')) return;
    // ---- Stats: righe completamente filtrate ----
    const allRows = getFullyFilteredRows();
    let totOre = 0, totValore = 0;
    const showCostsStats = currentUser.isAdmin || currentUser.canSeeCosts;
    for (const r of allRows) {
        const ore = parseOreDecimali(r.workedTime);
        totOre += ore;
        if (showCostsStats) {
            const mese = (r.date || '').slice(0, 7);
            totValore += ore * getCostoOrario(r.operatorDisplayName, mese);
        }
    }
    document.getElementById('dashTotOre').textContent = totOre.toFixed(2).replace('.', ',');
    document.getElementById('dashTotRapp').textContent = allRows.length;
    const elValore = document.getElementById('dashTotValore');
    if (elValore && showCostsStats)
        elValore.textContent = '€' + Math.round(totValore).toLocaleString('it-IT');

    // ---- 1) Bar chart commesse e clienti: ciascuno senza il proprio filtro ----
    const codiceCommessa = {};
    for (const r of dashData.rows) if (r.projectDescription && r.projectName && !codiceCommessa[r.projectDescription]) codiceCommessa[r.projectDescription] = r.projectName;
    disegnaBarreOre('commessa', 'chartCommesse', 'chartCommesseWrap', r => r.projectDescription || '?',
        { mostra: d => codiceCommessa[d] ? `${codiceCommessa[d]} - ${d}` : d, maxLen: 32 });
    _dashPopupVoce = null; // il grafico viene ridisegnato: al prossimo passaggio il popup si aggiorna
    disegnaBarreOre('cliente', 'chartClienti', 'chartClientiWrap', clienteRiga, { popupRapportini: mostraPopupRapportiniCliente });

    // ---- 2) Donut fatturare: usa righe senza filtro fatturare ----
    // ---- 2) Treemap servizi: usa righe senza filtro servizio ----
    const rowsForServ = getDashRowsFor('servizio');
    const orePerServ = {};
    for (const r of rowsForServ) {
        const s = r.serviceDescription || '?';
        orePerServ[s] = (orePerServ[s] || 0) + parseOreDecimali(r.workedTime);
    }
    const servSorted = Object.entries(orePerServ).sort((a, b) => b[1] - a[1]);
    const top5 = servSorted.slice(0, 5);
    const altroOre = servSorted.slice(5).reduce((s, [, v]) => s + v, 0);
    const displayServ = altroOre > 0 ? [...top5, ['Altro', altroOre, servSorted.slice(5)]] : top5;
    const totServOre = displayServ.reduce((s, [, v]) => s + v, 0);
    const selServ = dashSelection.servizio;

    const tmContainer = document.getElementById('dashTreemap');
    if (tmContainer) {
        tmContainer.innerHTML = buildTreemapHTML(displayServ, totServOre, (nome) => `toggleSelection('servizio','${jsArg(nome)}')`);
        requestAnimationFrame(() => adjustTreemapText(tmContainer));
    }
}

// Mappa dow JS (0=Dom..6=Sab) → chiave schedule
const DOW_KEY = ['sun','mon','tue','wed','thu','fri','sat'];

// Restituisce le ore previste per un operatore in un dato giorno (Date)
function getOreAttese(opName, date) {
    const sched = operatorSchedule[opName];
    if (!sched) return null;
    const key = DOW_KEY[date.getDay()];
    const v = sched[key];
    return (v != null && v > 0) ? v : null;
}

async function aggiornaCalendario() {
    const tableContainer = document.getElementById('calTableContainer');
    if (!tableContainer) return;
    tableContainer.innerHTML = '<div class="loading"><div class="spinner"></div>Caricamento...</div>';

    try {
        // Carica schedule operatori (una volta sola, poi cached)
        if (Object.keys(operatorSchedule).length === 0) {
            try {
                const sr = await fetch(`${API_BASE}/api/operators/schedule`);
                if (sr.ok) operatorSchedule = await sr.json();
            } catch (_) {}
        }

        const mm = String(calMese).padStart(2, '0');
        const lastDay = new Date(calAnno, calMese, 0).getDate();
        const dal = `${calAnno}-${mm}-01`;
        const al  = `${calAnno}-${mm}-${String(lastDay).padStart(2, '0')}`;

        const calOpFilter = (currentUser.allowedOperators && currentUser.allowedOperators.length > 0)
            ? ` AND LOWER(operatorDisplayName) IN (${currentUser.allowedOperators.map(o => `'${o.toLowerCase().replace(/'/g, "\\'")}'`).join(',')})`
            : '';
        const sql = `SELECT operatorDisplayName, date, workedTime, customerFiscalName, projectName, projectDescription, serviceName, serviceDescription, notes FROM \`tymex-1a330.tymex_client.documents\` WHERE date BETWEEN '${dal}' AND '${al}'${calOpFilter} ORDER BY operatorDisplayName, date`;
        const resp = await fetch(`${API_BASE}/api/bigquery/query`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sql })
        });
        if (!resp.ok) throw new Error('Errore query');
        const data = await resp.json();

        // Tutti i giorni del mese con il loro day-of-week
        const giorni = [];
        for (let d = 1; d <= lastDay; d++) {
            const dt = new Date(calAnno, calMese - 1, d);
            const dow = dt.getDay();
            if (dow > 0 && dow < 6) giorni.push({ d, dt }); // solo lun-ven
        }

        // Raggruppa ore per operatore e giorno
        const oreMap = {};
        calRapportini = {};
        for (const r of data.rows) {
            const op = r.operatorDisplayName || '?';
            const giorno = parseInt((r.date || '').slice(8, 10));
            const ore = parseOreDecimali(r.workedTime);
            if (!oreMap[op]) oreMap[op] = {};
            oreMap[op][giorno] = (oreMap[op][giorno] || 0) + ore;
            (calRapportini[giorno] = calRapportini[giorno] || []).push({ ...r, _ore: ore });
        }

        // Filtra operatori visibili secondo i permessi utente
        const allowed = currentUser.allowedOperators && currentUser.allowedOperators.length > 0
            ? new Set(currentUser.allowedOperators)
            : null;
        const operatori = Object.keys(oreMap)
            .filter(op => !allowed || allowed.has(op))
            .sort();
        calOperatori = operatori;
        if (operatori.length === 0) {
            tableContainer.innerHTML = '<p style="color:#888;text-align:center;padding:30px;">Nessun dato per questo mese.</p>';
            return;
        }

        // Helper formattazione ore
        const fmtOre = v => v % 1 === 0 ? v.toFixed(0) : v.toFixed(2).replace(/\.?0+$/, '');

        // Helper classe colore
        const calClass = (ore, attese) => {
            if (attese === null) return ore > 0 ? 'has-data' : '';
            const eps = 0.05;
            if (Math.abs(ore - attese) <= eps) return 'cal-ok';
            if (ore < attese)                   return 'cal-under';
            return 'cal-over';
        };

        // Legenda
        let legend = `<div style="display:flex;gap:14px;align-items:center;margin-bottom:10px;font-size:12px;">
            <span style="display:flex;align-items:center;gap:4px;"><span style="width:16px;height:16px;background:#c8e6c9;border:1px solid #a5d6a7;display:inline-block;border-radius:3px;"></span>Ore = previste</span>
            <span style="display:flex;align-items:center;gap:4px;"><span style="width:16px;height:16px;background:#fff9c4;border:1px solid #ffe082;display:inline-block;border-radius:3px;"></span>Ore &lt; previste</span>
            <span style="display:flex;align-items:center;gap:4px;"><span style="width:16px;height:16px;background:#ffcdd2;border:1px solid #ef9a9a;display:inline-block;border-radius:3px;"></span>Ore &gt; previste</span>
        </div>`;

        // Render tabella
        let html = legend + '<div class="cal-table-wrap"><table class="cal-table">';
        const GG_IT = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
        html += '<thead><tr><th class="cal-op-header">Operatore</th>';
        // Al passaggio del mouse su un giorno: popup con i rapportini (di quell'operatore, o di tutti su intestazione e totali)
        const calHover = (opIdx, d) => ` data-cal onmouseenter="apriPopup(event, e => showCalTooltip(e,${opIdx},${d}))" onmouseleave="popupLasciato()"`;
        for (const { d, dt } of giorni) {
            const hover = calRapportini[d] ? calHover(-1, d) : '';
            html += `<th style="line-height:1.2;"${hover}>${d}<br><span style="font-weight:400;font-size:10px;opacity:0.75;">${GG_IT[dt.getDay()]}</span></th>`;
        }
        html += '<th class="cal-total">Tot</th></tr></thead><tbody>';

        const totaliGiorno = {};
        operatori.forEach((op, opIdx) => {
            html += `<tr><td class="cal-op">${escapeHtml(op)}</td>`;
            let totOp = 0;
            for (const { d, dt } of giorni) {
                const ore = oreMap[op][d] || 0;
                totOp += ore;
                totaliGiorno[d] = (totaliGiorno[d] || 0) + ore;
                const attese = getOreAttese(op, dt);
                const cls = calClass(ore, attese);
                html += ore > 0
                    ? `<td class="cal-val ${cls}"${calHover(opIdx, d)}>${fmtOre(ore)}</td>`
                    : `<td class="cal-val"></td>`;
            }
            html += `<td class="cal-total">${fmtOre(totOp)}</td></tr>`;
        });

        // Riga totali
        html += '<tr style="border-top:2px solid #1b3a5c;"><td class="cal-op" style="font-weight:700;">TOTALE</td>';
        let grandTotal = 0;
        for (const { d } of giorni) {
            const t = totaliGiorno[d] || 0;
            grandTotal += t;
            html += t > 0
                ? `<td class="cal-val has-data" style="font-weight:700;"${calHover(-1, d)}>${fmtOre(t)}</td>`
                : '<td class="cal-val"></td>';
        }
        html += `<td class="cal-total">${fmtOre(grandTotal)}</td></tr>`;
        html += '</tbody></table></div>';

        tableContainer.innerHTML = html;
    } catch (e) {
        tableContainer.innerHTML = `<div class="error">Errore: ${escapeHtml(e.message)}</div>`;
    }
}

// Popup rapportini di un giorno: opIdx = riga operatore, -1 = tutti gli operatori
function showCalTooltip(event, opIdx, giorno) {
    const op = opIdx >= 0 ? calOperatori[opIdx] : null;
    const allowed = currentUser.allowedOperators && currentUser.allowedOperators.length > 0
        ? new Set(currentUser.allowedOperators) : null;
    const righe = (calRapportini[giorno] || [])
        .filter(r => op ? (r.operatorDisplayName || '?') === op : (!allowed || allowed.has(r.operatorDisplayName)));
    if (righe.length === 0) return;

    const dt = new Date(calAnno, calMese - 1, giorno);
    const dataTxt = dt.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const tot = righe.reduce((s, r) => s + r._ore, 0);
    const attese = op ? getOreAttese(op, dt) : null;
    let html = `<h4>${escapeHtml(dataTxt)}${op ? ' — ' + escapeHtml(op) : ''}</h4>`
             + `<div style="font-size:11px;color:#666;margin-bottom:6px;">${righe.length} rapportini · ${fmtOreDrill(tot)} h${attese !== null ? ` · previste ${fmtOreDrill(attese)} h` : ''}</div>`
             + `<table><thead><tr>${op ? '' : '<th>Operatore</th>'}<th>Cliente</th><th>Commessa</th><th>Servizio</th><th style="text-align:right">Ore</th><th>Note</th></tr></thead><tbody>`;
    for (const r of righe) {
        html += `<tr>${op ? '' : `<td>${escapeHtml(r.operatorDisplayName || '')}</td>`}
            <td>${escapeHtml(r.customerFiscalName || '')}</td>
            <td>${escapeHtml(etichettaCommessa(r.projectName, r.projectDescription))}</td>
            <td>${escapeHtml(r.serviceDescription || r.serviceName || '')}</td>
            <td style="text-align:right;white-space:nowrap">${fmtOreDrill(r._ore)}</td>
            <td style="min-width:140px">${escapeHtml(r.notes || '')}</td></tr>`;
    }
    html += '</tbody></table>';

    const tooltip = document.getElementById('serviceTooltip');
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    tooltip.style.maxWidth = '760px';
    tooltip.style.maxHeight = '420px';
    tooltip.style.overflowY = 'auto';
    moveAltroTooltip(event);
}

// Helper mesi
const NOMI_MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

// Helper: estrae mesi disponibili da un array di righe con campo date
function getAvailableMesi(rows) {
    const mesiSet = new Set();
    for (const r of rows) {
        const d = (r.date || r.Data || '').slice(0, 7);
        if (d.length === 7) mesiSet.add(d);
    }
    return [...mesiSet].sort().map(k => {
        const [anno, mm] = k.split('-');
        return { key: k, label: `${NOMI_MESI[parseInt(mm)-1]} ${anno}` };
    });
}

// Helper: converte '2026-01' in { dal: '2026-01-01', al: '2026-01-31' }
function meseKeyToRange(meseKey) {
    const [anno, mm] = meseKey.split('-');
    const y = parseInt(anno), m = parseInt(mm);
    const lastDay = new Date(y, m, 0).getDate();
    return { dal: `${anno}-${mm}-01`, al: `${anno}-${mm}-${String(lastDay).padStart(2,'0')}` };
}

function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s) {
    return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Stringa da mettere tra apici in un handler inline: onclick="fn('${jsArg(nome)}')"
function jsArg(s) {
    return escapeAttr(String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
}

function adminGeneratePassword() {
    const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789!@#';
    let pwd = '';
    for (let i = 0; i < 10; i++) pwd += chars[Math.floor(Math.random() * chars.length)];
    const el = document.getElementById('fPassword');
    el.value = pwd;
    el.type = 'text';
}

async function setDefaultPermissions(username, displayName) {
    await fetch(`${API_BASE}/api/admin/permissions`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username, allowedOperators: [displayName], canSeeCosts: false })
    });
}

async function adminAddAllOperators(operators) {
    const existing = new Set(
        [...document.querySelectorAll('#adminUserTable tbody tr td:first-child')].map(td => td.textContent.trim())
    );
    const toAdd = operators.filter(op => {
        const uname = op.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
        return uname && !existing.has(uname);
    });
    if (toAdd.length === 0) return alert('Tutti gli operatori sono già presenti come utenti.');
    if (!confirm(`Aggiungere ${toAdd.length} utenti?\n${toAdd.map(op => '• ' + op).join('\n')}`)) return;

    const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789!@#';
    const genPwd = () => { let p=''; for(let i=0;i<10;i++) p+=chars[Math.floor(Math.random()*chars.length)]; return p; };

    const results = [];
    for (const op of toAdd) {
        const username = op.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
        const password = genPwd();
        results.push({ displayName: op, username, password });
        await fetch(`${API_BASE}/api/admin/users`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ username, password, displayName: op, isAdmin: false })
        });
        await setDefaultPermissions(username, op);
    }
    alert('Utenti creati:\n' + results.map(r => `${r.displayName}  →  ${r.username} / ${r.password}`).join('\n'));
    caricaAdmin();
}

const _permEdits = {}; // {username: Set<string> | null}

function permCostsChange(cb) {

function permCheckboxChange(cb) {

async function adminSavePermissions() {
    const msgEl = document.getElementById('permSaveMsg');
    msgEl.textContent = 'Salvataggio...';

    const grid = document.getElementById('permGrid');

    // Raccoglie canSeeCosts dai checkbox data-costs
    const costsMap = {};
    grid.querySelectorAll('input[data-costs]:not([disabled])').forEach(cb => {
        costsMap[cb.dataset.user] = cb.checked;
    });

    // Raccoglie operatori abilitati per utenti non in _permEdits
    const byUser = {};
    grid.querySelectorAll('input[data-op]:not([disabled])').forEach(cb => {
        const u = cb.dataset.user;
        if (!byUser[u]) byUser[u] = [];
        if (cb.checked) byUser[u].push(cb.dataset.op);
    });

    // _permEdits sovrascrive solo per "Accesso totale" (null); per i Set usa byUser (stato reale dei checkbox)
    const allowedMap = { ...byUser };
    for (const [u, v] of Object.entries(_permEdits)) {
        if (v === null) allowedMap[u] = null;
    }

    // Admin: sempre null (vede tutto)
    grid.querySelectorAll('input[data-op][disabled]').forEach(cb => { allowedMap[cb.dataset.user] = null; });

    // Unione di tutti gli username coinvolti
    const allUsernames = new Set([...Object.keys(allowedMap), ...Object.keys(costsMap)]);

    // Costruisce payload bulk {username: {allowedOperators, canSeeCosts}}
    const bulk = {};
    for (const username of allUsernames) {
        bulk[username] = {
            allowedOperators: allowedMap[username] ?? null,
            canSeeCosts: costsMap[username] ?? false
        };
    }

    try {
        const resp = await fetch(`${API_BASE}/api/admin/permissions/bulk`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(bulk)
        });
        if (!resp.ok) {
            msgEl.style.color = '#c00';
            msgEl.textContent = `Errore HTTP ${resp.status}`;
            return;
        }
        const result = await resp.json();
        msgEl.style.color = '#2e7d6a';
        msgEl.textContent = result.persisted ? '✓ Salvato' : '⚠ Salvato in memoria (sync Railway fallita)';
        setTimeout(() => { msgEl.textContent = ''; msgEl.style.color = ''; }, 4000);
    } catch(e) {
        msgEl.style.color = '#c00';
        msgEl.textContent = 'Errore: ' + e.message;
    }
}

let homeAnno = null, homeMese = null;
let homeRows = [], homeSelectedComm = null, homeChartInstance = null;

function refreshHomeTreemap() {
    const filteredRows = homeSelectedComm
        ? homeRows.filter(r => (r.projectDescription || '?') === homeSelectedComm)
        : homeRows;
    const orePerServ = {};
    for (const r of filteredRows) {
        const s = r.serviceName || '?';
        orePerServ[s] = (orePerServ[s] || 0) + parseOreDecimali(r.workedTime);
    }
    const servSorted = Object.entries(orePerServ).sort((a,b) => b[1]-a[1]);
    const top5 = servSorted.slice(0, 5);
    const altroOre = servSorted.slice(5).reduce((s,[,v]) => s+v, 0);
    const display = altroOre > 0 ? [...top5, ['Altro', altroOre, servSorted.slice(5)]] : top5;
    const totOre = display.reduce((s,[,v]) => s+v, 0);
    const tmEl = document.getElementById('homeTreemap');
    const titleEl = document.getElementById('homeTreemapTitle');
    if (titleEl) {
        if (homeSelectedComm) {
            const label = homeSelectedComm.length > 28 ? homeSelectedComm.slice(0,26)+'…' : homeSelectedComm;
            titleEl.innerHTML = `Servizi per: <span style="color:#3B5BDB;">${escapeHtml(label)}</span> <span style="font-size:11px;color:#aaa;cursor:pointer;" onclick="homeSelectedComm=null;refreshHomeTreemap();updateHomeChartColors();" title="Rimuovi filtro">✕</span>`;
        } else {
            titleEl.textContent = 'Top Servizi per ore';
        }
    }
    if (tmEl) {
        if (display.length > 0) {
            tmEl.innerHTML = buildTreemapHTML(display, totOre, null);
            requestAnimationFrame(() => adjustTreemapText(tmEl));
        } else {
            tmEl.innerHTML = '<div style="color:#aaa;font-size:12px;padding:8px;">Nessun dato per questa commessa</div>';
        }
    }
}

function updateHomeChartColors() {
    if (!homeChartInstance) return;
    homeChartInstance.data.datasets[0].backgroundColor = homeChartInstance.data.labels.map((_, i) =>
        homeSelectedComm === null || homeSelectedComm === homeChartInstance._commNames[i]
            ? '#3B5BDB' : 'rgba(59,91,219,0.25)'
    );
    homeChartInstance.update('none');
}

function buildTreemapHTML(items, totOre, onclickFn) {
    const GAP = 0.4;
    const totalGap = GAP * (items.length - 1);
    let leftPct = 0;
    return items.map(([nome, ore, dettaglio], i) => {
        const rawPct = totOre > 0 ? ore / totOre * 100 : 0;
        const widthPct = rawPct * (100 - totalGap) / 100;
        const left = leftPct;
        leftPct += widthPct + (i < items.length - 1 ? GAP : 0);
        const bg = TREEMAP_COLORS[i % TREEMAP_COLORS.length];
        const oc = onclickFn ? ` onclick="${onclickFn(nome)}"` : '';
        // Il blocco "Altro" mostra al passaggio del mouse il dettaglio dei servizi raggruppati
        const tip = dettaglio
            ? ` data-altro="${escapeAttr(JSON.stringify(dettaglio))}" onmouseenter="apriPopup(event, e => showAltroTooltip(e, this))" onmouseleave="popupLasciato()"`
            : ` title="${escapeAttr(nome)}: ${ore.toFixed(2)}h (${rawPct.toFixed(1)}%)"`;
        return `<div data-tm-pct="${widthPct.toFixed(3)}" style="position:absolute;left:${left.toFixed(3)}%;width:${widthPct.toFixed(3)}%;height:100%;background:${bg};border-radius:4px;overflow:hidden;box-sizing:border-box;cursor:${onclickFn?'pointer':'default'};"${oc}${tip}>
            <span class="tm-label-name" style="position:absolute;top:7px;left:6px;right:4px;color:white;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(nome)}</span>
            <span class="tm-label-hours" style="position:absolute;bottom:7px;left:6px;color:rgba(255,255,255,0.92);font-size:11px;font-weight:600;">${ore.toFixed(1)}h</span>
        </div>`;
    }).join('');
}

function adjustTreemapText(container) {
    const cw = container.offsetWidth;
    container.querySelectorAll('[data-tm-pct]').forEach(block => {
        const bw = cw * parseFloat(block.dataset.tmPct) / 100;
        const nameEl = block.querySelector('.tm-label-name');
        const hoursEl = block.querySelector('.tm-label-hours');
        if (!nameEl) return;
        if (bw < 28) {
            nameEl.style.display = 'none';
            if (hoursEl) hoursEl.style.display = 'none';
        } else if (bw < 62) {
            nameEl.style.cssText = 'position:absolute;top:6px;left:0;right:0;color:white;font-size:10px;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;overflow:hidden;white-space:nowrap;max-height:90px;margin:auto;width:fit-content;left:50%;transform:translateX(-50%) rotate(180deg);';
            if (hoursEl) hoursEl.style.cssText = 'display:none';
        }
    });
}

async function caricaHome(annoSel, meseSel) {
    document.querySelector('.rapportini-section').style.display = 'none';
    document.querySelector('.results-header').style.display = 'none';
    document.querySelector('.results-section').classList.add('cruscotto-mode');
    document.querySelectorAll('.btn-table').forEach(b => b.classList.remove('active'));
    document.getElementById('btnHome')?.classList.add('active');
    currentTable = null;

    const container = document.getElementById('resultsContainer');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>Caricamento...</div>';

    try {
        const now = new Date();
        const anno = annoSel || homeAnno || now.getFullYear();
        const mese = (meseSel !== undefined && meseSel !== null) ? meseSel : (homeMese !== null ? homeMese : (now.getMonth() + 1));
        homeAnno = anno; homeMese = mese;
        const isTuttoAnno = (mese === 0);
        const mm   = isTuttoAnno ? null : String(mese).padStart(2, '0');
        const isCurrentMonth = !isTuttoAnno && (anno === now.getFullYear() && mese === (now.getMonth() + 1));
        const isCurrentYear  = anno === now.getFullYear();
        const oggi = now.toISOString().slice(0, 10);
        const lastDay = isTuttoAnno ? 31 : new Date(anno, mese, 0).getDate();
        const dal  = isTuttoAnno ? `${anno}-01-01` : `${anno}-${mm}-01`;
        const al   = isTuttoAnno ? (isCurrentYear ? oggi : `${anno}-12-31`)
                                 : (isCurrentMonth ? oggi : `${anno}-${mm}-${String(lastDay).padStart(2,'0')}`);

        // Carica schedule se non già in cache
        if (Object.keys(operatorSchedule).length === 0) {
            try {
                const sr = await fetch(`${API_BASE}/api/operators/schedule`);
                if (sr.ok) operatorSchedule = await sr.json();
            } catch(_) {}
        }

        // Query ore del mese corrente
        const opF = (currentUser.allowedOperators && currentUser.allowedOperators.length > 0)
            ? ` AND LOWER(operatorDisplayName) IN (${currentUser.allowedOperators.map(o => `'${o.toLowerCase().replace(/'/g, "\\'")}'`).join(',')})`
            : '';
        const sql = `SELECT date, workedTime, projectDescription, serviceName FROM \`tymex-1a330.tymex_client.documents\` WHERE date BETWEEN '${dal}' AND '${al}'${opF} ORDER BY date DESC`;
        const resp = await fetch(`${API_BASE}/api/bigquery/query`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sql })
        });
        if (!resp.ok) throw new Error('Errore query');
        const data = await resp.json();

        // Raggruppa ore per giorno
        let oreTotali = 0;
        const orePerGiorno = {};
        for (const r of data.rows) {
            const ore = parseOreDecimali(r.workedTime);
            oreTotali += ore;
            if (r.date) { const dk = String(r.date).slice(0, 10); orePerGiorno[dk] = (orePerGiorno[dk] || 0) + ore; }
        }

        // Schedule dell'utente
        const myName = currentUser.allowedOperators?.[0] || currentUser.displayName;
        const sched  = operatorSchedule[Object.keys(operatorSchedule).find(k => k.toLowerCase() === myName?.toLowerCase())] || {};
        const DOW_KEY2 = ['sun','mon','tue','wed','thu','fri','sat'];
        const todayN = isCurrentMonth ? now.getDate() : (isTuttoAnno ? 0 : lastDay);

        // Giorni lavorativi trascorsi: ore attese e giorni mancanti
        let oreAttese = 0, oreObiettivoMese = 0;
        const giorniMancanti = [];
        if (isTuttoAnno) {
            // Somma obiettivo su tutti i mesi dell'anno
            for (let m = 1; m <= 12; m++) {
                const daysInMonth = new Date(anno, m, 0).getDate();
                const mmm = String(m).padStart(2,'0');
                const cutDay = (isCurrentYear && m === now.getMonth()+1) ? now.getDate()
                             : (isCurrentYear && m > now.getMonth()+1) ? 0 : daysInMonth;
                for (let d = 1; d <= daysInMonth; d++) {
                    const dt  = new Date(anno, m - 1, d);
                    const key = DOW_KEY2[dt.getDay()];
                    const att = (sched[key] != null && sched[key] > 0) ? sched[key] : 0;
                    oreObiettivoMese += att;
                    if (d <= cutDay && att > 0) oreAttese += att;
                }
            }
        } else {
            for (let d = 1; d <= lastDay; d++) {
                const dt  = new Date(anno, mese - 1, d);
                const key = DOW_KEY2[dt.getDay()];
                const att = (sched[key] != null && sched[key] > 0) ? sched[key] : 0;
                oreObiettivoMese += att;
                if (d <= todayN && att > 0) {
                    oreAttese += att;
                    const ds = `${anno}-${mm}-${String(d).padStart(2, '0')}`;
                    if ((orePerGiorno[ds] || 0) === 0) giorniMancanti.push({ ds, d, dow: dt.getDay() });
                }
            }
        }

        // Colore avanzamento
        const ratio = oreAttese > 0 ? oreTotali / oreAttese : 1;
        const fillColor = ratio >= 0.95 ? '#2e7d32' : ratio >= 0.7 ? '#f57c00' : '#c62828';
        const percBarra = oreObiettivoMese > 0 ? Math.min(100, Math.round(oreTotali / oreObiettivoMese * 100)) : 0;

        const NOMI_MESI_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
        const GG_IT_S = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
        const fmtDate = ds => { const p = ds.split('-'); return `${p[2]}/${p[1]}`; };

        // Ultimi 8 rapportini
        const recenti = data.rows.slice(0, 8);

        // Giorni mancanti: max 10 (solo per singolo mese)
        const mancHtml = isTuttoAnno ? '' : (giorniMancanti.length === 0
            ? `<p class="home-ok-msg">✓ Nessun giorno lavorativo senza rapportini fino ad oggi!</p>`
            : `<div class="home-missing-list">${giorniMancanti.slice(0, 10).map(g =>
                `<span class="home-missing-chip past">${GG_IT_S[g.dow]} ${fmtDate(g.ds)}</span>`).join('')}
              ${giorniMancanti.length > 10 ? `<span class="home-missing-chip past">+${giorniMancanti.length - 10} altri</span>` : ''}</div>`);

        container.innerHTML = `
        <div class="home-page">
            <div class="home-greeting">Ciao, ${escapeHtml(currentUser.displayName)}</div>
            <div class="home-subtitle" style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
                <select onchange="caricaHome(homeAnno, parseInt(this.value))" style="border:none;background:transparent;font-size:13px;color:#555;font-weight:600;cursor:pointer;padding:2px 4px;border-radius:4px;border-bottom:1px solid #ccc;">
                    <option value="0" ${mese===0?'selected':''}>Tutto</option>
                    ${NOMI_MESI_IT.map((n,i) => `<option value="${i+1}" ${i+1===mese?'selected':''}>${n}</option>`).join('')}
                </select>
                <select onchange="caricaHome(parseInt(this.value), homeMese)" style="border:none;background:transparent;font-size:13px;color:#555;font-weight:600;cursor:pointer;padding:2px 4px;border-radius:4px;border-bottom:1px solid #ccc;">
                    ${[2024,2025,2026,2027].map(a => `<option value="${a}" ${a===anno?'selected':''}>${a}</option>`).join('')}
                </select>
            </div>

            <div class="home-cards">
                <div class="home-card">
                    <div class="hc-label">Ore registrate</div>
                    <div class="hc-value" style="color:${fillColor}">${oreTotali.toFixed(2).replace('.',',')}</div>
                    <div class="hc-sub">su ${oreAttese > 0 ? oreAttese.toFixed(0)+' attese a oggi' : 'nessun obiettivo impostato'}</div>
                </div>
                <div class="home-card">
                    <div class="hc-label">${isTuttoAnno ? 'Obiettivo anno' : 'Obiettivo mese'}</div>
                    <div class="hc-value">${oreObiettivoMese > 0 ? oreObiettivoMese.toFixed(0) : '—'}</div>
                    <div class="hc-sub">ore totali previste</div>
                </div>
                <div class="home-card">
                    <div class="hc-label">Rapportini</div>
                    <div class="hc-value" style="color:#3B5BDB">${data.rows.length}</div>
                    <div class="hc-sub">${isTuttoAnno ? 'quest\'anno' : 'questo mese'}</div>
                </div>
                ${isTuttoAnno ? '' : `<div class="home-card">
                    <div class="hc-label">Giorni mancanti</div>
                    <div class="hc-value" style="color:${giorniMancanti.length === 0 ? '#2e7d32' : '#c62828'}">${giorniMancanti.length}</div>
                    <div class="hc-sub">fino ad oggi</div>
                </div>`}
            </div>

            ${oreObiettivoMese > 0 ? `
            <div class="home-progress-wrap">
                <div class="home-progress-label">
                    <span>Avanzamento mese</span>
                    <span style="color:${fillColor};font-weight:700">${percBarra}%</span>
                </div>
                <div class="home-progress-bar">
                    <div class="home-progress-fill" style="width:${percBarra}%;background:${fillColor}"></div>
                </div>
                <div style="font-size:11px;color:#aaa;margin-top:6px;">
                    ${oreTotali.toFixed(2).replace('.',',')} ore registrate su ${oreObiettivoMese.toFixed(0)} previste per il mese
                </div>
            </div>` : ''}

            <div style="display:flex;gap:16px;flex-wrap:wrap;">
                <div class="home-progress-wrap" style="flex:1;min-width:280px;margin-bottom:0;">
                    <div class="home-recent-title" style="font-size:14px;font-weight:700;color:#1b3a5c;margin-bottom:12px;">Ore lavorate per Commessa</div>
                    <div style="position:relative;" id="homeChartCommWrap">

                    <div id="homeTreemap" style="position:relative;height:120px;overflow:hidden;border-radius:6px;"></div>
                </div>

        homeSelectedComm = null;

        const orePerComm = {};
        for (const r of data.rows) {
            const c = r.projectDescription || '?';

        const commSorted    = Object.entries(orePerComm).sort((a,b) => b[1]-a[1]);

        const wrap = document.getElementById('homeChartCommWrap');
        const ctx  = document.getElementById('homeChartComm');
        if (wrap && ctx && commSorted.length > 0) {
            wrap.style.height = Math.max(commSorted.length * 28, 120) + 'px';
            if (homeChartInstance) { homeChartInstance.destroy(); homeChartInstance = null; }
            homeChartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: commLabels, datasets: [{ data: commValues, backgroundColor: commValues.map(() => '#3B5BDB'), borderRadius: 3 }] },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    cursor: 'pointer',
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: {
                            title: i => commFullNames[i[0].dataIndex],
                            label: c => c.raw.toFixed(2) + ' ore'
                        }}
                    },
                    scales: {
                        x: { grid: { color: '#eee' } },
                        y: { grid: { display: false }, ticks: { font: { size: 11 } } }
                    },
                    onClick(evt, elements) {
                        if (!elements.length) return;
                        const nome = commFullNames[elements[0].index];
                        homeSelectedComm = homeSelectedComm === nome ? null : nome;
                        updateHomeChartColors();
                        refreshHomeTreemap();
                    }
                }
            });
            homeChartInstance._commNames = commFullNames;
            ctx.style.cursor = 'pointer';
        }

        // Treemap servizi (primo caricamento)
        refreshHomeTreemap();
    } catch(e) {
        container.innerHTML = `<div style="color:#c62828;padding:20px">Errore: ${e.message}</div>`;
    }
}

// ========================================================
// AUTO-LOAD: Carica currentUser, costi da link salvati, poi cruscotto
// ========================================================
let currentUser = { username: '', displayName: '', isAdmin: false, allowedOperators: null, canSeeCosts: false };

// Il nome del cliente arriva dal server (appsettings.json → Cliente:Nome)
function applicaNomeCliente() {
    const nome = currentUser.cliente;
    if (!nome) return;
    document.title = nome;
    const el = document.querySelector('.tymex-title');
    if (el) el.textContent = nome.toUpperCase();
}

(async function() {
    try {
        const res = await fetch(`${API_BASE}/api/auth/me`);
        if (res.ok) currentUser = await res.json();
    } catch(e) {}
    applicaNomeCliente();
    initAdminButton();

    // Mostra HOME solo per utenti non-admin (cruscotto visibile a tutti)
    if (!currentUser.isAdmin) {
        document.getElementById('btnHome').style.display = '';
    }

    // Carica costi orari operatori da BigQuery (per admin e utenti con canSeeCosts)
    if (currentUser.isAdmin || currentUser.canSeeCosts) {
        try {
            const costsRes = await fetch(`${API_BASE}/api/operators/costs`);
            if (costsRes.ok) operatorCostRates = await costsRes.json();
        } catch(e) {}
    }

    if (currentUser.isAdmin) caricaCruscotto();
    else caricaHome();
})();
</script>
